# brew tap-new uses this file to generate a bottle publish workflow for the new tap
name: brew pr-pull

on: # zizmor: ignore[dangerous-triggers]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)
  # Auto-publish pull requests opened by the auto-bump workflow
  # (.github/workflows/autobump.yml) as soon as `brew test-bot` succeeds on
  # them, so they don't need a manual `workflow_dispatch`. Pull requests
  # opened by anyone else still require a manual dispatch, as before. This
  # job checks out no PR code and only reads PR metadata (author, head SHA)
  # via the GitHub API before deciding whether to proceed, so it is not
  # susceptible to the usual `workflow_run` code-injection risk.
  workflow_run:
    workflows:
      - brew test-bot
    types:
      - completed

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      - name: Resolve pull request
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PULL_REQUEST: ${{ inputs.pull_request }}
          DISPATCH_HEAD_SHA: ${{ inputs.head_sha }}
          WORKFLOW_RUN_PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]
          then
            {
              echo "pull_request=$DISPATCH_PULL_REQUEST"
              echo "head_sha=$DISPATCH_HEAD_SHA"
              echo "proceed=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$WORKFLOW_RUN_PULL_REQUEST" ]]
          then
            echo "No associated pull request found; skipping." >&2
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          author=$(gh pr view "$WORKFLOW_RUN_PULL_REQUEST" --repo "$GITHUB_REPOSITORY" \
            --json author --jq '.author.login')
          if [[ "$author" != "github-actions[bot]" ]]
          then
            echo "Pull request #$WORKFLOW_RUN_PULL_REQUEST was not opened by auto-bump" \
              "(author: $author); skipping." >&2
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "pull_request=$WORKFLOW_RUN_PULL_REQUEST"
            echo "head_sha=$WORKFLOW_RUN_HEAD_SHA"
            echo "proceed=true"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Homebrew
        if: steps.resolve.outputs.proceed == 'true'
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        if: steps.resolve.outputs.proceed == 'true'
        id: git_setup
        uses: Homebrew/actions/git-user-config@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1

      - name: Pull bottles
        if: steps.resolve.outputs.proceed == 'true'
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          PULL_REQUEST: ${{ steps.resolve.outputs.pull_request }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" \
              "$PULL_REQUEST"
          else
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      - name: Generate build provenance
        if: steps.resolve.outputs.proceed == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        if: steps.resolve.outputs.proceed == 'true'
        uses: Homebrew/actions/git-try-push@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          branch: main
