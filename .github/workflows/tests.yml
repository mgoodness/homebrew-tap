# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

  generate-cask-matrix:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    # `generate-cask-ci-matrix` loads casks from the tap's `Library/Taps`
    # symlink that `setup-homebrew` creates for third-party taps; Homebrew's
    # `forbid_packages_from_paths?` check otherwise rejects that path unless
    # developer mode is on. `homebrew-cask`'s own `ci.yml` sets this for the
    # same reason.
    env:
      HOMEBREW_DEVELOPER: 1
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          cask: true

      - name: Generate cask CI matrix
        id: generate-matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `generate-cask-ci-matrix` errors out on any modified Ruby file
          # outside `Casks/`, since it assumes a cask-only tap. This tap also
          # has `Formula/`, so skip the command for PRs that don't touch any
          # cask, rather than have it flag changed formulae as misplaced.
          if ! gh pr view "$PR_NUMBER" --json files --jq '.files[].path' | grep -q '^Casks/'; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          full_matrix=$(brew generate-cask-ci-matrix --url "$PULL_REQUEST_URL")
          # Drop the tap-syntax entries that `generate-cask-ci-matrix` always
          # includes: the `test-bot` job above already covers `--only-tap-syntax`.
          cask_matrix=$(echo "$full_matrix" | jq -c '[.[] | select(.cask)]')
          echo "matrix=$cask_matrix" >> "$GITHUB_OUTPUT"

  test-casks:
    needs: generate-cask-matrix
    if: needs.generate-cask-matrix.outputs.matrix != '[]'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }} # zizmor: ignore[unpinned-images]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-cask-matrix.outputs.matrix) }}
    # See the comment on `generate-cask-matrix`: the same symlinked tap path
    # needs developer mode for `fetch`/`audit`/`install`/`uninstall --cask`.
    env:
      HOMEBREW_DEVELOPER: 1
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          cask: true

      - name: Run brew fetch --cask ${{ matrix.cask.token }}
        id: fetch
        run: brew fetch --cask --retry --force ${{ join(matrix.fetch_args, ' ') }} '${{ matrix.cask.path }}'
        timeout-minutes: 30

      - name: Run brew audit --cask ${{ matrix.cask.token }}
        run: brew audit --cask ${{ join(matrix.audit_args, ' ') }} '${{ matrix.cask.token }}'
        if: always() && steps.fetch.outcome == 'success'
        timeout-minutes: 30

      - name: Gather cask information
        id: info
        env:
          CASK_PATH: ${{ matrix.cask.path }}
        run: brew cask-ci info "$CASK_PATH"
        if: always() && steps.fetch.outcome == 'success'

      - name: Take snapshot of installed and running apps and services
        id: snapshot
        run: brew cask-ci snapshot
        if: always() && steps.info.outcome == 'success'

      - name: Run brew install --cask ${{ matrix.cask.token }}
        id: install
        run: brew install --cask '${{ matrix.cask.path }}'
        if: >
          always() && steps.info.outcome == 'success' &&
          fromJSON(steps.info.outputs.macos_requirement_satisfied) &&
          !matrix.skip_install
        timeout-minutes: 30

      - name: Check for missing zap paths
        run: brew cask-ci zap-check '${{ matrix.cask.path }}'
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10

      - name: Run brew uninstall --cask ${{ matrix.cask.token }}
        run: brew uninstall --cask --force --zap '${{ matrix.cask.path }}'
        if: always() && steps.install.outcome == 'success' && !fromJSON(steps.info.outputs.manual_installer)
        timeout-minutes: 30

      - name: Compare installed and running apps and services with snapshot
        run: brew cask-ci check '${{ matrix.cask.path }}'
        if: always() && steps.snapshot.outcome == 'success' && steps.install.outcome == 'success'
